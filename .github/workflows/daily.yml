name: Fetch job listings

# Measured before enabling: one manual run took 53s wall clock and billed as
# 1 minute, so daily is ~30 min/month against the 2000 free private-repo
# minutes.
#
# 01:00 UTC is deliberately early. GitHub cron is UTC and never shifts with
# daylight saving, so this is 03:00 Amsterdam in summer (CEST) and 02:00 in
# winter (CET). Actions schedules are best-effort and can be delayed by
# anything from minutes to a couple of hours at peak, so the run needs a long
# runway to be finished before a 08:30 start. It also matters that it lands
# overnight: fetch.py rewrites the Inbox tab wholesale, and a run firing
# mid-review would clobber ticks you had just made.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 Amsterdam (CEST) / 02:00 (CET)

permissions:
  contents: write

concurrency:
  group: fetch-listings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Tests
        # The triage rules are pattern matching over free text, so a mistake
        # silently demotes real jobs rather than crashing. Fail before touching
        # the spreadsheet.
        run: |
          pip install pytest
          python3 -m pytest pipeline/test_pipeline.py -q

      - name: Fetch and triage
        env:
          # The service account JSON, stored as a repo secret. common.py reads
          # this when pipeline/service_account.json is absent, which it is
          # here because the key is gitignored.
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python3 pipeline/fetch.py

      - name: Commit the updated catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a first run, where ads/ does not exist yet, does not error.
          git add -A pipeline/
          if git diff --staged --quiet; then
            echo "No listing changes today."
          else
            git commit -m "Listings update $(date -u +%Y-%m-%d)"
            git push
          fi
